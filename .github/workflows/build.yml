name: test-and-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@v2

  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 so the Linux executables run on older glibc too.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build executables
        run: cargo build --release --workspace --locked

      - name: Smoke-test executables
        shell: bash
        run: |
          cli=target/release/wbquery-cli
          $cli --version
          $cli -q tests/golden/smoke/query.json -o smoke_out/results --print | tee smoke.log
          grep -q "Joined: 1 row(s)" smoke.log
          test -s smoke_out/results.xlsx && test -s smoke_out/results.html
          # The app runs the command line when given options.
          target/release/wbquery -q tests/golden/smoke/query.json -o smoke_out/app --formats html | grep -q "Joined: 1 row(s)"

      - uses: actions/upload-artifact@v4
        with:
          name: wbquery-${{ runner.os }}
          path: |
            target/release/wbquery${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/wbquery-cli${{ runner.os == 'Windows' && '.exe' || '' }}
            licenses/

  # After every successful build on main, publish the executables as a public GitHub Release
  # (downloadable by anyone with access to the repo; the artifacts above need a login and expire).
  # The release is named after the program version; pushing again without a version bump replaces
  # it, so its tag always points at the commit the files were built from.
  release:
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v${version}"
          mkdir release
          cp wbquery-Windows/target/release/wbquery.exe wbquery-Windows/target/release/wbquery-cli.exe release/
          cp wbquery-Linux/target/release/wbquery release/wbquery-linux
          cp wbquery-Linux/target/release/wbquery-cli release/wbquery-cli-linux
          cp licenses/Ubuntu-Font-Licence-1.0.txt release/
          (cd release && sha256sum wbquery.exe wbquery-cli.exe wbquery-linux wbquery-cli-linux > SHA256SUMS.txt)
          cat > notes.md <<NOTES
          Built from commit ${GITHUB_SHA::7} after all tests passed.

          - **Windows:** download **wbquery.exe** and double-click it (\`wbquery-cli.exe\` is the command-line version).
            Windows may show a SmartScreen warning because the exe isn't code-signed: click *More info* → *Run anyway*.
          - **Linux:** download **wbquery-linux**, run \`chmod +x wbquery-linux\`, then run it.
          - **SHA256SUMS.txt** lists each file's fingerprint.
          - The app's font is under the Ubuntu Font Licence (included).
          NOTES
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" release/* --target "$GITHUB_SHA" --latest \
            --title "Workbook Query $tag" --notes-file notes.md
