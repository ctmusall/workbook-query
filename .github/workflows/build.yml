name: test-and-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # --- Rust port (crates/) -------------------------------------------------------------
  # Runs alongside the Python build until the Rust app replaces it; the release job below
  # still publishes the Python executables until then.

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@v2

  rust:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 so the Linux binary runs on older glibc too.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build executables
        run: cargo build --release --workspace --locked

      - name: Smoke-test CLI executable
        shell: bash
        run: |
          bin=target/release/wbquery-cli
          $bin --version
          $bin -q tests/golden/smoke/query.json -o smoke_out/results --print | tee smoke.log
          grep -q "Joined: 1 row(s)" smoke.log
          test -s smoke_out/results.xlsx && test -s smoke_out/results.html

      - name: Smoke-test app executable (options run the command line)
        shell: bash
        run: |
          target/release/wbquery --version
          target/release/wbquery -q tests/golden/smoke/query.json -o smoke_out/app --formats html | grep -q "Joined: 1 row(s)"

      - uses: actions/upload-artifact@v4
        with:
          name: wbquery-rust-${{ runner.os }}
          path: |
            target/release/wbquery${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/wbquery-cli${{ runner.os == 'Windows' && '.exe' || '' }}
            licenses/

  # --- Python app (wbquery/): the shipped product until the Rust port is complete --------

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest --cov=wbquery --cov-report=term-missing

      - name: Build executables
        run: python -m PyInstaller --noconfirm --clean wbquery.spec

      - name: Smoke-test CLI executable
        shell: bash
        run: |
          ./dist/wbquery-cli --version
          python tests/data/make_smoke.py smoke
          ./dist/wbquery-cli -q smoke/query.json -o smoke_out/results --print | tee smoke.log
          grep -q "Joined: 1 row(s)" smoke.log
          test -s smoke_out/results.xlsx && test -s smoke_out/results.html

      - uses: actions/upload-artifact@v4
        with:
          name: wbquery-${{ runner.os }}
          path: dist/*

  # After every successful build on main, publish the executables as a public GitHub Release
  # (downloadable by anyone with access to the repo; the artifacts above need a login and expire).
  # The release is named after the program version; pushing again without a version bump replaces
  # it, so its tag always points at the commit the files were built from.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' wbquery/__init__.py)
          tag="v${version}"
          mkdir release
          cp wbquery-Windows/wbquery.exe wbquery-Windows/wbquery-cli.exe release/
          cp wbquery-Linux/wbquery release/wbquery-linux
          cp wbquery-Linux/wbquery-cli release/wbquery-cli-linux
          (cd release && sha256sum * > SHA256SUMS.txt)
          cat > notes.md <<NOTES
          Built from commit ${GITHUB_SHA::7} after all tests passed.

          - **Windows:** download **wbquery.exe** and double-click it (\`wbquery-cli.exe\` is the command-line version).
            Windows may show a SmartScreen warning because the exe isn't code-signed: click *More info* → *Run anyway*.
          - **Linux:** download **wbquery-linux**, run \`chmod +x wbquery-linux\`, then run it.
          - **SHA256SUMS.txt** lists each file's fingerprint.
          NOTES
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" release/* --target "$GITHUB_SHA" --latest \
            --title "Workbook Query $tag" --notes-file notes.md
