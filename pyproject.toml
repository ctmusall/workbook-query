[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbook-query"
version = "0.1.0"
description = "Query rows across many Excel workbooks and sheets with AND/OR conditions and export the matches"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "pyinstaller>=6.10",
]

[project.scripts]
wbquery = "wbquery.__main__:main"
wbquery-cli = "wbquery.cli:main"

[tool.setuptools]
packages = ["wbquery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.coverage.run]
source = ["wbquery"]
